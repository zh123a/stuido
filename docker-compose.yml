services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stuido
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  # 本地开发直接 pnpm --filter web dev + pnpm --filter worker dev，无需容器化 web
volumes:
  pgdata:
